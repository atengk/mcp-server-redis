name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

# 动态并发控制：PR 提交自动中断陈旧运行以节约算力；主干提交排队顺序执行保历史完整
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: PR 标题规范校验 (仅在 PR 触发时执行)
  # ----------------------------------------------------------------------------
  validate-pr-title:
    name: 校验 PR 标题规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: 校验 PR 标题符合 Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  # ----------------------------------------------------------------------------
  # Job 2: 动态探测变更路径 (内部短路直通网关)
  # ----------------------------------------------------------------------------
  detect-changes:
    name: 探测变更路径
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 分析改动文件类型
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!(*.md|docs/**|.gitignore|.editorconfig|LICENSE)'

  # ----------------------------------------------------------------------------
  # Job 3: 静态检查与类型分析 (uv + ruff + mypy)
  # ----------------------------------------------------------------------------
  lint-and-typecheck:
    name: 静态检查与类型分析
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code_changed != 'false'
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 同步项目依赖
        run: uv sync --all-extras

      - name: Ruff 代码规范检查
        run: uv run ruff check .

      - name: Ruff 格式化自检
        run: uv run ruff format --check .

      - name: Mypy 静态类型推断
        run: uv run mypy .

  # ----------------------------------------------------------------------------
  # Job 4: 跨版本兼容性单元测试矩阵 (pytest)
  # ----------------------------------------------------------------------------
  test-matrix:
    name: 跨版本兼容性测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-typecheck]
    if: needs.detect-changes.outputs.code_changed != 'false'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11"]') || fromJSON('["3.10", "3.11", "3.12"]') }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 同步项目依赖
        run: uv sync --all-extras

      - name: 运行 Pytest 测试套件
        run: uv run pytest -v

  # ----------------------------------------------------------------------------
  # Job 5: 质量门禁终审盖戳与看板摘要
  # ----------------------------------------------------------------------------
  all-checks-passed:
    name: 质量门禁终审 (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-pr-title, lint-and-typecheck, test-matrix]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 汇总校验各任务执行结果
        run: |
          TITLE_RESULT="${{ needs.validate-pr-title.result }}"
          DETECT_RESULT="${{ needs.detect-changes.result }}"
          LINT_RESULT="${{ needs.lint-and-typecheck.result }}"
          TEST_RESULT="${{ needs.test-matrix.result }}"

          echo "任务状态汇总: PR标题=[$TITLE_RESULT], 变更探测=[$DETECT_RESULT], 规范扫描=[$LINT_RESULT], 单测矩阵=[$TEST_RESULT]"

          if [ "$TITLE_RESULT" = "failure" ] || [ "$TITLE_RESULT" = "cancelled" ]; then
            echo "::error::PR 标题规范校验失败！请按照 Conventional Commits 规范修改 PR 标题。"
            exit 1
          fi

          if [ "$DETECT_RESULT" = "failure" ] || [ "$DETECT_RESULT" = "cancelled" ]; then
            echo "::error::变更路径探测任务异常中断！"
            exit 1
          fi

          if [ "$LINT_RESULT" = "failure" ] || [ "$LINT_RESULT" = "cancelled" ]; then
            echo "::error::Ruff / Mypy 静态检查与类型分析失败！"
            exit 1
          fi

          if [ "$TEST_RESULT" = "failure" ] || [ "$TEST_RESULT" = "cancelled" ]; then
            echo "::error::Pytest 单元与集成测试失败！门禁熔断阻断。"
            exit 1
          fi

          echo "✅ 全部必要质量门禁已全部通过！"

      - name: 生成门禁看板摘要报告
        if: always()
        run: |
          {
            echo "## 🚦 CI 质量门禁终审报告"
            echo ""
            echo "| 检查项 | 判定状态 | 执行说明 |"
            echo "| :--- | :---: | :--- |"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "| **PR 标题规范校验** | ${{ needs.validate-pr-title.result == 'success' && '✅ 通过' || '❌ 失败' }} | Conventional Commits 语义化规范 |"
            fi
            echo "| **变更路径探测** | ${{ needs.detect-changes.result == 'success' && '✅ 通过' || '❌ 异常' }} | 区分文档短路与核心代码构建 |"
            if [ "${{ needs.detect-changes.outputs.code_changed }}" = "false" ]; then
              echo "| **代码规范与测试** | ⚡ 短路直通 | 仅涉及文档改动，自动跳过耗时测试并放行 |"
            else
              echo "| **Ruff & Mypy 静态检查** | ${{ needs.lint-and-typecheck.result == 'success' && '✅ 通过' || '❌ 失败' }} | 静态语法风格、格式化与类型推断 |"
              echo "| **Pytest 兼容性测试** | ${{ needs.test-matrix.result == 'success' && '✅ 通过' || '❌ 失败' }} | 跨 Python 版本兼容性矩阵验证 |"
            fi
            echo ""
            echo "> 💡 **分支保护规则建议**：请在 GitHub 仓库设置中将 \`质量门禁终审 (All Checks Passed)\` 设为唯一 Required Status Check。"
          } >> "$GITHUB_STEP_SUMMARY"
