# mcp-server-redis 多环境连接配置文件示例
# 启动命令: uvx atengk-mcp-server-redis --config ./connections.yaml

default: local

connections:
  local:
    url: "redis://localhost:6379/0"
    readonly: false
    description: "本地开发默认 Redis (DB 0)"
    key_patterns: ["*"]

  user-cache:
    url: "redis://localhost:6379/1"
    readonly: false
    description: "用户中心会话与 Token 缓存"
    key_patterns: ["token:*", "user:*", "session:*"]

  staging-readonly:
    url: "redis://:your_auth_password@192.168.1.100:6379/0"
    readonly: true
    description: "预发布环境只读连接 (强制拦截写操作)"
    key_patterns: ["order:*", "report:*"]
